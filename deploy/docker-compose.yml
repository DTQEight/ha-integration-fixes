# 本机部署拓扑：HA 走 host 网络（8123），60s 走 bridge（4399）
# 用法：把 /volume6/docker/homeassistant 换成你的实际路径，然后 docker compose up -d

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Asia/Shanghai
    volumes:
      - /volume6/docker/homeassistant/config:/config
    # host 网络下无需 ports；8123 直接监听在宿主机

  sixty:
    image: vikiboss/60s:latest
    container_name: sixty
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "4399:4399"
    # HA 使用 network_mode: host 时，sixy.py 里的 127.0.0.1:4399 即指向这里；
    # 若 HA 改成 bridge 网络，需要把 sixy.py 的 BASE 改成宿主机 IP。

# 提醒：
# 1. custom_components/map_tiles 里的代理地址写死为 http://192.168.31.1:7890，按需修改。
# 2. secrets.yaml 不入库，首次部署从 secrets.example.yaml 复制一份并填值。
